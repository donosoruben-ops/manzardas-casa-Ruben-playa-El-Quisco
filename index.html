document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"es\"><head>\n<meta charset=\"utf-8\">\n<title>Mansarda 3D — techo 4 aguas<\u002Ftitle>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.184.0/build/three.module.js\",\n    \"three/addons/controls/OrbitControls.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\",\n    \"three/addons/exporters/OBJExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\",\n    \"three/addons/exporters/GLTFExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\"\n  },\n  \"integrity\": {\n    \"https://unpkg.com/three@0.184.0/build/three.module.js\": \"sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J\",\n    \"https://unpkg.com/three@0.184.0/build/three.core.js\": \"sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\": \"sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\": \"sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\": \"sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ\"\n  }\n}\n<\u002Fscript>\n<style>\n  html, body { margin: 0; height: 100%; background: #F2EFE8; }\n  three-d-stage:not(:defined) { visibility: hidden; }\n  three-d-stage { display: block; width: 100vw; height: 100vh; }\n  #ficha, #panel {\n    position: fixed; z-index: 5;\n    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.6;\n    color: #3A362F; background: rgba(252,251,248,0.9); border: 1px solid #C9C3B6;\n    padding: 12px 16px; letter-spacing: 0.02em;\n  }\n  #ficha { left: 24px; top: 24px; }\n  #panel { left: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; width: 260px; }\n  #ficha strong, .titulo { display: block; font-size: 11px; letter-spacing: 0.16em; color: #8C877C; }\n  #ficha strong { font-size: 13px; color: #3A362F; margin-bottom: 6px; }\n  .fila { display: flex; align-items: center; gap: 8px; }\n  input[type=range] { flex: 1; accent-color: #B4573A; }\n  #valorTecho { width: 66px; text-align: right; }\n  button {\n    font-family: inherit; font-size: 12px; letter-spacing: 0.04em; cursor: pointer;\n    padding: 8px 10px; border: 1px solid #3A362F; background: #FCFBF8; color: #1B1A17;\n  }\n  button:hover { background: #1B1A17; color: #FCFBF8; }\n  #ayuda { color: #8C877C; font-size: 11px; line-height: 1.5; }\n<\u002Fstyle>\n<\u002Fhead>\n<body><three-d-stage name=\"mansarda\" background=\"#F2EFE8\"><\u002Fthree-d-stage>\n<div id=\"ficha\">\n  <strong>AMPLIACIÓN MANSARDA<\u002Fstrong>\n  Frente hacia la playa · 5,00 m<br>\n  Fondo · 6,00 m<br>\n  Altura de muro · 2,50 m<br>\n  Techo 4 aguas, cumbre en punto central<br>\n  Ventanal completo · 4,80 × 1,95 m, sin pilar intermedio<br>\n  Viga dintel del ventanal · 250 × 100, luz libre 5,00 m<br>\n  Inserta en el techo verde a dos aguas · 7,00 m de luz, 3,50 cada agua\n<\u002Fdiv>\n<div id=\"panel\">\n  <div>\n    <span class=\"titulo\">LEVANTAR TECHO · AL MÁXIMO DESAPARECE<\u002Fspan>\n    <div class=\"fila\">\n      <input id=\"techo\" type=\"range\" min=\"0\" max=\"6\" step=\"0.1\" value=\"0\">\n      <span id=\"valorTecho\">0,00 m<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <button id=\"modo\">Recorrer por dentro<\u002Fbutton>\n  <button id=\"casaBtn\">Ver solo la mansarda<\u002Fbutton>\n  <button id=\"maestranzaBtn\">Ver solo estructura (maestranza)<\u002Fbutton>\n  <div id=\"ayuda\">Exterior: arrastra para girar, rueda para acercar. Sobre la barra, la rueda sube y baja el techo.<\u002Fdiv>\n<\u002Fdiv>\n<script src=\"abff289b-21e0-4650-9186-adff24e981f6\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\n\nconst M = {\n  muro: new THREE.MeshStandardMaterial({ name: 'muro', color: 0xE8E2D6, roughness: 0.92, metalness: 0, side: THREE.DoubleSide }),\n  tabique: new THREE.MeshStandardMaterial({ name: 'tabique', color: 0xDCD5C6, roughness: 0.95, metalness: 0, side: THREE.DoubleSide }),\n  teja: new THREE.MeshStandardMaterial({ name: 'teja', color: 0xB4573A, roughness: 0.8, metalness: 0, side: THREE.DoubleSide }),\n  madera: new THREE.MeshStandardMaterial({ name: 'madera', color: 0x8A6A46, roughness: 0.65, metalness: 0 }),\n  piso: new THREE.MeshStandardMaterial({ name: 'piso', color: 0xC5B294, roughness: 0.85, metalness: 0 }),\n  cristal: new THREE.MeshStandardMaterial({ name: 'cristal', color: 0xBFD8DE, roughness: 0.08, metalness: 0.25, transparent: true, opacity: 0.28, side: THREE.DoubleSide }),\n  ceramica: new THREE.MeshStandardMaterial({ name: 'ceramica', color: 0xF4F2ED, roughness: 0.25, metalness: 0 }),\n  textil: new THREE.MeshStandardMaterial({ name: 'textil', color: 0xE3DACA, roughness: 0.95, metalness: 0 })\n};\n\nconst model = new THREE.Group();\nmodel.name = 'mansarda';\nconst grupoTecho = new THREE.Group();\ngrupoTecho.name = 'techo';\nmodel.add(grupoTecho);\n\n// plan (x: 0..5 ancho, y: 0..6 fondo, y=0 al fondo, y=6 hacia la playa) -> escena (x, z)\nconst px = x => x - 2.5;\nconst pz = y => y - 3;\n\nfunction box(w, h, d, cx, cy, cz, mat, name, parent) {\n  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);\n  m.position.set(cx, cy, cz);\n  m.name = name;\n  m.castShadow = true;\n  m.receiveShadow = true;\n  (parent || model).add(m);\n  return m;\n}\nfunction muroX(x1, x2, yFijo, y0, y1, t, mat, name) {\n  box(x2 - x1, y1 - y0, t, px((x1 + x2) / 2), (y0 + y1) / 2, pz(yFijo), mat, name);\n}\nfunction muroY(y1, y2, xFijo, h0, h1, t, mat, name) {\n  box(t, h1 - h0, y2 - y1, px(xFijo), (h0 + h1) / 2, pz((y1 + y2) / 2), mat, name);\n}\n\nbox(5.0, 0.16, 6.0, 0, -0.08, 0, M.piso, 'losa_piso');\n\n// muro de fondo: puerta principal y dos ventanas\nmuroX(0.00, 0.10, 0, 0, 2.5, 0.15, M.muro, 'muro_fondo_a');\nmuroX(0.90, 1.40, 0, 0, 2.5, 0.15, M.muro, 'muro_fondo_b');\nmuroX(2.60, 4.05, 0, 0, 2.5, 0.15, M.muro, 'muro_fondo_c');\nmuroX(4.65, 5.00, 0, 0, 2.5, 0.15, M.muro, 'muro_fondo_d');\nmuroX(0.10, 0.90, 0, 2.10, 2.5, 0.15, M.muro, 'dintel_puerta_principal');\nmuroX(1.40, 2.60, 0, 0, 1.00, 0.15, M.muro, 'antepecho_ventana_camarote');\nmuroX(1.40, 2.60, 0, 2.10, 2.5, 0.15, M.muro, 'dintel_ventana_camarote');\nmuroX(4.05, 4.65, 0, 0, 1.00, 0.15, M.muro, 'antepecho_ventana_bano');\nmuroX(4.05, 4.65, 0, 2.10, 2.5, 0.15, M.muro, 'dintel_ventana_bano');\nbox(1.20, 1.10, 0.03, px(2.00), 1.55, pz(0), M.cristal, 'cristal_ventana_camarote');\nbox(0.60, 1.10, 0.03, px(4.35), 1.55, pz(0), M.cristal, 'cristal_ventana_bano');\n\nmuroY(0, 6, 0.00, 0, 2.5, 0.15, M.muro, 'muro_izquierdo');\nmuroY(0, 6, 5.00, 0, 2.5, 0.15, M.muro, 'muro_derecho');\n\n// fachada hacia la playa: ventanal 4,80 x 1,95, antepecho de 0,45 para pasar sobre el techo verde continuo\nmuroY(5.90, 6.00, 0.05, 0, 2.5, 0.10, M.muro, 'retorno_ventanal_izq');\nmuroY(5.90, 6.00, 4.95, 0, 2.5, 0.10, M.muro, 'retorno_ventanal_der');\nmuroX(0.05, 4.95, 5.95, 0, 0.45, 0.10, M.muro, 'antepecho_ventanal');\nbox(2.398, 1.95, 0.03, px(1.30), 1.425, pz(6.00), M.cristal, 'cristal_ventanal_izq');\nbox(2.398, 1.95, 0.03, px(3.70), 1.425, pz(6.00), M.cristal, 'cristal_ventanal_der');\nbox(4.90, 0.16, 0.14, px(2.50), 2.42, pz(6.00), M.madera, 'viga_ventanal');\nbox(4.90, 0.10, 0.16, px(2.50), 0.50, pz(6.00), M.madera, 'umbral_ventanal');\n\n// tabiques interiores, con sus vanos de puertas\n[[0.00, 0.75], [1.45, 2.50], [3.30, 4.00]].forEach((r, i) =>\n  muroY(r[0], r[1], 0.90, 0, 2.5, 0.10, M.tabique, 'tabique_pasillo_' + (i + 1)));\n[[0.00, 0.75], [1.45, 1.50]].forEach((r, i) =>\n  muroY(r[0], r[1], 3.00, 0, 2.5, 0.10, M.tabique, 'tabique_camarote_bano_' + (i + 1)));\n[[0.90, 3.50], [4.30, 5.00]].forEach((r, i) =>\n  muroX(r[0], r[1], 1.50, 0, 2.5, 0.10, M.tabique, 'tabique_servicios_' + (i + 1)));\n[[1.50, 3.10], [3.90, 4.00]].forEach((r, i) =>\n  muroY(r[0], r[1], 3.50, 0, 2.5, 0.10, M.tabique, 'tabique_dormitorio_' + (i + 1)));\n[[1.50, 1.90], [3.80, 4.00]].forEach((r, i) =>\n  muroY(r[0], r[1], 4.30, 0, 2.5, 0.10, M.tabique, 'tabique_closet_' + (i + 1)));\n[[0.00, 0.05], [0.85, 0.90], [0.90, 3.50], [4.30, 5.00]].forEach((r, i) =>\n  muroX(r[0], r[1], 4.00, 0, 2.5, 0.10, M.tabique, 'tabique_biblioteca_' + (i + 1)));\n\n// ——— mobiliario ———\n// cama grande 1,60 x 2,00\nbox(1.60, 0.30, 2.00, px(2.55), 0.15, pz(2.525), M.madera, 'cama_base');\nbox(1.56, 0.24, 1.96, px(2.55), 0.42, pz(2.525), M.textil, 'cama_colchon');\nbox(0.68, 0.13, 0.34, px(2.17), 0.60, pz(1.80), M.textil, 'cama_almohada_izq');\nbox(0.68, 0.13, 0.34, px(2.93), 0.60, pz(1.80), M.textil, 'cama_almohada_der');\nbox(1.66, 0.85, 0.06, px(2.55), 0.425, pz(1.56), M.madera, 'cama_respaldo');\n\n// camarote: literas 0,90 x 1,90\n[[1.04, 0.09], [2.86, 0.09], [1.04, 0.91], [2.86, 0.91]].forEach((p, i) =>\n  box(0.08, 1.95, 0.08, px(p[0]), 0.975, pz(p[1]), M.madera, 'litera_poste_' + (i + 1)));\nbox(1.90, 0.10, 0.90, px(1.95), 0.40, pz(0.50), M.madera, 'litera_baja_base');\nbox(1.86, 0.16, 0.86, px(1.95), 0.53, pz(0.50), M.textil, 'litera_baja_colchon');\nbox(1.90, 0.10, 0.90, px(1.95), 1.40, pz(0.50), M.madera, 'litera_alta_base');\nbox(1.86, 0.16, 0.86, px(1.95), 1.53, pz(0.50), M.textil, 'litera_alta_colchon');\nbox(1.90, 0.08, 0.08, px(1.95), 1.78, pz(0.91), M.madera, 'litera_baranda');\n[0.72, 1.06].forEach((h, i) => box(0.05, 0.05, 0.86, px(2.90), h, pz(0.50), M.madera, 'litera_peldano_' + (i + 1)));\n\n// baño: ducha 0,90 x 0,90, WC y lavamanos\nbox(0.90, 0.10, 0.90, px(4.50), 0.05, pz(0.50), M.ceramica, 'ducha_plato');\nbox(0.02, 1.90, 0.90, px(4.05), 1.05, pz(0.50), M.cristal, 'ducha_mampara_lateral');\nbox(0.90, 1.90, 0.02, px(4.50), 1.05, pz(0.95), M.cristal, 'ducha_mampara_frontal');\nbox(0.12, 0.10, 0.22, px(4.50), 2.05, pz(0.14), M.ceramica, 'ducha_rociador');\nbox(0.36, 0.42, 0.48, px(3.30), 0.21, pz(0.50), M.ceramica, 'wc_taza');\nbox(0.36, 0.06, 0.46, px(3.30), 0.45, pz(0.50), M.ceramica, 'wc_tapa');\nbox(0.38, 0.42, 0.18, px(3.30), 0.55, pz(0.17), M.ceramica, 'wc_tanque');\nbox(0.56, 0.80, 0.34, px(4.65), 0.40, pz(1.31), M.madera, 'lavamanos_mueble');\nbox(0.62, 0.06, 0.40, px(4.65), 0.83, pz(1.29), M.ceramica, 'lavamanos_cubierta');\nbox(0.60, 0.70, 0.02, px(4.65), 1.45, pz(1.46), M.cristal, 'lavamanos_espejo');\n\n// closet: repisas y barra\n[0.45, 0.95, 1.45, 2.20].forEach((h, i) =>\n  box(0.66, 0.04, 2.25, px(4.65), h, pz(2.725), M.madera, 'closet_repisa_' + (i + 1)));\nconst barra = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 2.25, 12), M.madera);\nbarra.name = 'closet_barra';\nbarra.rotation.x = Math.PI / 2;\nbarra.position.set(px(4.65), 1.95, pz(2.725));\nbarra.castShadow = true;\nmodel.add(barra);\n\n// ——— puertas ———\nconst H_PUERTA = 2.05;\n// correderas: hoja estacionada al lado del vano + riel superior\nfunction correderaY(xHoja, y1, y2, nombre) {  // desliza a lo largo de un tabique vertical\n  box(0.04, H_PUERTA, y2 - y1, px(xHoja), H_PUERTA / 2, pz((y1 + y2) / 2), M.madera, nombre);\n  box(0.07, 0.07, (y2 - y1) + 0.10, px(xHoja), H_PUERTA + 0.07, pz((y1 + y2) / 2), M.madera, nombre + '_riel');\n}\ncorrederaY(0.96, 0.02, 0.78, 'corredera_pasillo_camarote');\ncorrederaY(2.94, 0.02, 0.78, 'corredera_camarote_bano');\ncorrederaY(3.44, 2.28, 3.04, 'corredera_dormitorio');\nbox(0.04, H_PUERTA, 0.94, px(4.36), H_PUERTA / 2, pz(2.40), M.madera, 'corredera_closet_1');\nbox(0.04, H_PUERTA, 0.94, px(4.40), H_PUERTA / 2, pz(3.32), M.madera, 'corredera_closet_2');\n\n// batientes: hoja abierta 90°\nbox(0.04, H_PUERTA, 0.80, px(0.88), H_PUERTA / 2, pz(0.50), M.madera, 'puerta_principal_hoja');\nbox(0.04, H_PUERTA, 0.80, px(4.26), H_PUERTA / 2, pz(1.94), M.madera, 'puerta_bano_hoja');\nbox(0.04, H_PUERTA, 0.80, px(0.81), H_PUERTA / 2, pz(4.44), M.madera, 'puerta_biblioteca_izq_hoja');\nbox(0.04, H_PUERTA, 0.80, px(4.26), H_PUERTA / 2, pz(4.44), M.madera, 'puerta_biblioteca_der_hoja');\n\n// techo de 4 aguas: pirámide de base rectangular, cumbre en un punto central\nconst ALERO = 0.40, BASE_X = 5.0 + 2 * ALERO, BASE_Z = 6.0 + 2 * ALERO, ALTO_TECHO = 1.70;\nconst geoTecho = new THREE.CylinderGeometry(0.0001, 1, ALTO_TECHO, 4, 1, false);\ngeoTecho.rotateY(Math.PI / 4);\ngeoTecho.scale(BASE_X / Math.SQRT2, 1, BASE_Z / Math.SQRT2);\nconst techo = new THREE.Mesh(geoTecho, M.teja);\ntecho.name = 'techo_4_aguas';\ntecho.position.set(0, 2.5 + ALTO_TECHO / 2, 0);\ntecho.castShadow = true;\ntecho.receiveShadow = true;\ngrupoTecho.add(techo);\nbox(BASE_X, 0.14, 0.06, 0, 2.47, BASE_Z / 2, M.madera, 'tapacan_playa', grupoTecho);\nbox(BASE_X, 0.14, 0.06, 0, 2.47, -BASE_Z / 2, M.madera, 'tapacan_fondo', grupoTecho);\nbox(0.06, 0.14, BASE_Z, BASE_X / 2, 2.47, 0, M.madera, 'tapacan_der', grupoTecho);\nbox(0.06, 0.14, BASE_Z, -BASE_X / 2, 2.47, 0, M.madera, 'tapacan_izq', grupoTecho);\n\n// ——— estructura de maestranza: cubo de fierro + estructura del techo de 4 aguas ———\nconst MM = {\n  fierro: new THREE.MeshStandardMaterial({ name: 'fierro', color: 0x4A4E52, roughness: 0.5, metalness: 0.85 }),\n  galvanizado: new THREE.MeshStandardMaterial({ name: 'acero_galvanizado', color: 0xB9C0C4, roughness: 0.32, metalness: 0.95 })\n};\nconst maestranza = new THREE.Group();\nmaestranza.name = 'maestranza';\nmaestranza.visible = false;\nmodel.add(maestranza);\n\nfunction perfil(w, h, d, cx, cy, cz, mat, name) {\n  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);\n  m.position.set(cx, cy, cz);\n  m.name = name;\n  m.castShadow = true;\n  maestranza.add(m);\n}\nfunction barraM(p1, p2, esp, mat, name) {\n  const len = p1.distanceTo(p2);\n  const m = new THREE.Mesh(new THREE.BoxGeometry(esp, esp, len), mat);\n  m.position.copy(p1).add(p2).multiplyScalar(0.5);\n  m.lookAt(p2);\n  m.name = name;\n  m.castShadow = true;\n  maestranza.add(m);\n}\nconst P = 0.10, ALTO_M = 2.50;\n// pilares del cubo\n[[0.05, 0.05], [4.95, 0.05], [0.05, 5.95], [4.95, 5.95], [2.50, 0.05],\n [0.05, 2.00], [0.05, 4.00], [4.95, 2.00], [4.95, 4.00]].forEach((p, i) =>\n  perfil(P, ALTO_M, P, px(p[0]), ALTO_M / 2, pz(p[1]), MM.fierro, 'pilar_' + (i + 1)));\n// vigas perimetrales, piso y coronamiento\n[0.05, ALTO_M].forEach((h, n) => {\n  perfil(5.00, P, P, px(2.50), h, pz(0.05), MM.fierro, 'viga_fondo_' + (n + 1));\n  perfil(5.00, n === 1 ? 0.25 : P, 0.10, px(2.50), n === 1 ? h - 0.075 : h, pz(5.95), MM.fierro, 'viga_frente_' + (n + 1));\n  perfil(P, P, 6.00, px(0.05), h, pz(3.00), MM.fierro, 'viga_izq_' + (n + 1));\n  perfil(P, P, 6.00, px(4.95), h, pz(3.00), MM.fierro, 'viga_der_' + (n + 1));\n});\n// vigas intermedias del entrepiso\n[1.00, 2.00, 3.00, 4.00, 5.00].forEach((y, i) =>\n  perfil(5.00, 0.14, 0.06, px(2.50), 0.05, pz(y), MM.fierro, 'viga_piso_' + (i + 1)));\n// arriostramiento horizontal a media altura\nperfil(5.00, 0.06, 0.06, px(2.50), 1.25, pz(0.05), MM.fierro, 'travesano_fondo');\nperfil(P, 0.06, 6.00, px(0.05), 1.25, pz(3.00), MM.fierro, 'travesano_izq');\nperfil(P, 0.06, 6.00, px(4.95), 1.25, pz(3.00), MM.fierro, 'travesano_der');\n// estructura del techo de 4 aguas: cumbrera en punto, limatesas y pares\nconst CUMBRE = new THREE.Vector3(0, ALTO_M + ALTO_TECHO, 0);\nconst esquinas = [[-BASE_X / 2, -BASE_Z / 2], [BASE_X / 2, -BASE_Z / 2], [BASE_X / 2, BASE_Z / 2], [-BASE_X / 2, BASE_Z / 2]];\nesquinas.forEach((e, i) =>\n  barraM(new THREE.Vector3(e[0], ALTO_M, e[1]), CUMBRE, 0.10, MM.fierro, 'limatesa_' + (i + 1)));\n[1.0, 2.0, 3.9, 4.9].forEach((x, i) => {\n  barraM(new THREE.Vector3(px(x), ALTO_M, pz(0) - 0.40), CUMBRE, 0.07, MM.fierro, 'par_fondo_' + (i + 1));\n  barraM(new THREE.Vector3(px(x), ALTO_M, pz(6) + 0.40), CUMBRE, 0.07, MM.fierro, 'par_frente_' + (i + 1));\n});\n[1.2, 2.4, 3.6, 4.8].forEach((y, i) => {\n  barraM(new THREE.Vector3(px(0) - 0.40, ALTO_M, pz(y)), CUMBRE, 0.07, MM.fierro, 'par_izq_' + \nstage._scene.add(terreno);\nconst mar = new THREE.Mesh(\n  new THREE.PlaneGeometry(200, 160),\n  new THREE.MeshStandardMaterial({ name: 'mar', color: 0x86A7AC, roughness: 0.35, metalness: 0.2 })\n);\nmar.name = 'mar';\nmar.rotation.x = -Math.PI / 2;\nmar.position.set(0, -0.16, 92);\nstage._scene.add(mar);\n\n// ——— casa existente (contexto, no se exporta): la mansarda va sobre la losa plana ———\nconst MC = {\n  blanco: new THREE.MeshStandardMaterial({ name: 'casa_blanco', color: 0xF0EDE6, roughness: 0.9 }),\n  piedra: new THREE.MeshStandardMaterial({ name: 'casa_piedra', color: 0x8B8880, roughness: 1 }),\n  verde: new THREE.MeshStandardMaterial({ name: 'casa_techo_teja', color: 0xB4573A, roughness: 0.8 }),\n  losa: new THREE.MeshStandardMaterial({ name: 'casa_losa', color: 0xD6D2C8, roughness: 0.95 }),\n  toldo: new THREE.MeshStandardMaterial({ name: 'casa_toldo', color: 0xEFF2F0, roughness: 0.4, transparent: true, opacity: 0.5, side: THREE.DoubleSide })\n};\nconst casa = new THREE.Group();\ncasa.name = 'casa_existente';\nfunction cajaCasa(w, h, d, cx, cy, cz, mat, name) {\n  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);\n  m.position.set(cx, cy, cz);\n  m.name = name;\n  m.castShadow = true;\n  m.receiveShadow = true;\n  casa.add(m);\n  return m;\n}\n// planos 1957 · planta 10,50 (3,70 + 6,80) x 10,10 m\n// cuerpo oriente de 6,80 con techo verde a dos aguas de 7,00 de luz (3,50 cada agua); la mansarda se inserta en él\nconst MURO_CASA = 2.60, LUZ_TECHO = 7.00, RISE_TECHO = 2.10;\ncajaCasa(6.80, MURO_CASA, LUZ_TECHO, 0, MURO_CASA / 2, 0, MC.blanco, 'casa_cuerpo_oriente');\ncajaCasa(3.70, MURO_CASA, 10.10, -5.25, MURO_CASA / 2, 0.30, MC.blanco, 'casa_ala_poniente');\ncajaCasa(6.80, MURO_CASA, 1.25, 0, MURO_CASA / 2, -4.125, MC.blanco, 'casa_franja_posterior');\ncajaCasa(10.70, 0.90, 10.30, -1.85, 0.45, 0.30, MC.piedra, 'casa_zocalo');\n// ampliación terraza grande, vidriada, al frente hacia la playa\n[].forEach((p, i) =>\n  cajaCasa(0.16, MURO_CASA, 0.16, p[0], MURO_CASA / 2, p[1], MC.blanco, 'terraza_pilar_' + (i + 1)));\ncajaCasa(6.80, 2.30, 0.05, -0.05, 1.25, 5.33, MC.toldo, 'terraza_vidrio_frente').visible = false;\n// techos a dos aguas de la casa\nfunction prismaX(largo, span, rise, cx, cy, cz, name) {\n  const s = new THREE.Shape();\n  s.moveTo(-span / 2, 0); s.lineTo(span / 2, 0); s.lineTo(0, rise); s.closePath();\n  const g = new THREE.ExtrudeGeometry(s, { depth: largo, bevelEnabled: false });\n  g.rotateY(-Math.PI / 2);\n  g.translate(cx + largo / 2, cy, cz);\n  const m = new THREE.Mesh(g, MC.verde);\n  m.name = name; m.castShadow = true;\n  casa.add(m);\n}\nfunction prismaZ(largo, span, rise, cx, cy, cz, name) {\n  const s = new THREE.Shape();\n  s.moveTo(-span / 2, 0); s.lineTo(span / 2, 0); s.lineTo(0, rise); s.closePath();\n  const g = new THREE.ExtrudeGeometry(s, { depth: largo, bevelEnabled: false });\n  g.translate(cx, cy, cz - largo / 2);\n  const m = new THREE.Mesh(g, MC.verde);\n  m.name = name; m.castShadow = true;\n  casa.add(m);\n}\n// techo verde a dos aguas, partido para dejar libre el interior de la mansarda (x -2,50 a 2,50)\nprismaX(0.95, LUZ_TECHO + 0.20, RISE_TECHO, -2.975, MURO_CASA, 0, 'casa_techo_verde_poniente');\nprismaX(0.95, LUZ_TECHO + 0.20, RISE_TECHO, 2.975, MURO_CASA, 0, 'casa_techo_verde_oriente');\n// faldones bajos que cierran el techo por delante y por detrás de la mansarda\ncajaCasa(5.00, 0.16, 0.70, 0, MURO_CASA + 0.08, 3.25, MC.verde, 'casa_techo_verde_frente_mansarda');\ncajaCasa(5.00, 0.16, 0.70, 0, MURO_CASA + 0.08, -3.25, MC.verde, 'casa_techo_verde_atras_mansarda');\n// ala poniente: dos aguas perpendicular, con el frontón mirando al frente\nprismaZ(10.30, 4.80, RISE_TECHO, -4.80, MURO_CASA, 0.30, 'casa_techo_verde_frente');\n// continuación del techo sobre la franja posterior\ncajaCasa(6.90, 0.18, 1.35, 0, MURO_CASA + 0.09, -4.18, MC.verde, 'casa_techo_verde_posterior');\n[[-5.30, 5.47], [1.20, -4.82]].forEach((p, i) =>\n  cajaCasa(2.60, 1.50, 0.06, p[0], 1.55, p[1], M.cristal, 'casa_ventana_' + (i + 1)));\ncasa.visible = false;\nstage._scene.add(casa);\n\nconst NIVEL_CASA = MURO_CASA;\nlet nivel = 0;\n\n// ——— abrir el techo ———\nconst slider = document.getElementById('techo');\nconst valor = document.getElementById('valorTecho');\nfunction aplicarTecho() {\n  const v = parseFloat(slider.value);\n  const sinTecho = v >= parseFloat(slider.max) - 0.001;\n  grupoTecho.visible = !sinTecho;\n  grupoTecho.position.y = v;\n  valor.textContent = sinTecho ? 'sin techo' : v.toFixed(2).replace('.', ',') + ' m';\n}\nslider.addEventListener('input', aplicarTecho);\nslider.addEventListener('wheel', (e) => {\n  e.preventDefault();\n  const v = parseFloat(slider.value) - Math.sign(e.deltaY) * 0.2;\n  slider.value = String(Math.min(6, Math.max(0, v)));\n  aplicarTecho();\n}, { passive: false });\naplicarTecho();\n\n// ——— recorrido interior ———\nconst controls = stage._controls, camara = stage._camera;\nconst boton = document.getElementById('modo');\nconst ayuda = document.getElementById('ayuda');\nconst teclas = new Set();\nlet dentro = false;\nlet guardado = null;\nconst LIMITE = { x: 2.32, z: 2.82 };\nconst ALTO_OJO = 1.60;\n\nfunction entrar() {\n  dentro = true;\n  guardado = { pos: camara.position.clone(), target: controls.target.clone(), fov: camara.fov };\n  camara.fov = 75;\n  camara.updateProjectionMatrix();\n  if (parseFloat(slider.value) < 2) { slider.value = '2.6'; aplicarTecho(); }\n  camara.position.set(-2.05, nivel + ALTO_OJO, -2.50);\n  controls.target.set(-1.85, nivel + ALTO_OJO - 0.10, 0.60);\n  ayuda.textContent = 'W A S D o flechas para caminar · rueda para avanzar y retroceder · arrastra para mirar · Esc para salir.';\n  controls.enableZoom = false;\n  controls.enablePan = false;\n  controls.minDistance = 0.5;\n  controls.maxDistance = 4;\n  controls.update();\n  boton.textContent = 'Volver a vista exterior';\n}\nfunction salir() {\n  dentro = false;\n  controls.enableZoom = true;\n  controls.enablePan = true;\n  controls.minDistance = 0;\n  controls.maxDistance = Infinity;\n  if (guardado) {\n    camara.position.copy(guardado.pos);\n    controls.target.copy(guardado.target);\n    camara.fov = guardado.fov;\n    camara.updateProjectionMatrix();\n  }\n  controls.update();\n  boton.textContent = 'Recorrer por dentro';\n  ayuda.textContent = 'Exterior: arrastra para girar, rueda para zoom. Sobre la barra, la rueda sube y baja el techo.';\n}\nboton.addEventListener('click', () => (dentro ? salir() : entrar()));\nconst casaBtn = document.getElementById('casaBtn');\nfunction verCasa(on) {\n  casa.visible = on;\n  nivel = on ? NIVEL_CASA : 0;\n  model.position.y = nivel;\n  casaBtn.textContent = on ? 'Ver solo la mansarda' : 'Ver sobre la casa';\n  if (dentro) {\n    camara.position.y = nivel + ALTO_OJO;\n    controls.target.y = nivel + ALTO_OJO - 0.10;\n  } else if (on) {\n    camara.position.set(11, 13, 19);\n    controls.target.set(-1.9, 2.6, -1.0);\n  } else {\n    camara.position.set(5.5, 4.2, 9);\n    controls.target.set(0, 1.2, 0);\n  }\n  controls.update();\n}\ncasaBtn.addEventListener('click', () => verCasa(!casa.visible));\nverCasa(true);\n\nconst maestranzaBtn = document.getElementById('maestranzaBtn');\nlet soloEstructura = false;\nfunction verMaestranza(on) {\n  soloEstructura = on;\n  model.children.forEach(c => { if (c !== maestranza) c.visible = !on; });\n  maestranza.visible = on;\n  if (!on) aplicarTecho();\n  maestranzaBtn.textContent = on ? 'Ver la mansarda terminada' : 'Ver solo estructura (maestranza)';\n  slider.disabled = on;\n  if (on && casa.visible) verCasa(false);\n}\nmaestranzaBtn.addEventListener('click', () => verMaestranza(!soloEstructura));\n\n// rueda: en el recorrido interior avanza y retrocede (zoom in / zoom out)\nstage.addEventListener('wheel', (e) => {\n  if (!dentro) return;\n  e.preventDefault();\n  const dir = new THREE.Vector3().subVectors(controls.target, camara.position).setY(0).normalize();\n  const d = -Math.sign(e.deltaY) * 0.28;\n  const nx = THREE.MathUtils.clamp(camara.position.x + dir.x * d, -LIMITE.x, LIMITE.x);\n  const nz = THREE.MathUtils.clamp(camara.position.z + dir.z * d, -LIMITE.z, LIMITE.z);\n  const mov = new THREE.Vector3(nx - camara.position.x, 0, nz - camara.position.z);\n  camara.position.add(mov);\n  controls.target.add(mov);\n  controls.update();\n}, { passive: false });\n\nwindow.addEventListener('keydown', (e) => {\n  if (e.key === 'Escape' && dentro) { salir(); return; }\n  teclas.add(e.key.toLowerCase());\n});\nwindow.addEventListener('keyup', (e) => teclas.delete(e.key.toLowerCase()));\n\nconst adelante = new THREE.Vector3(), lado = new THREE.Vector3(), paso = new THREE.Vector3();\nlet ultimo = performance.now();\n(function caminar(t) {\n  requestAnimationFrame(caminar);\n  const dt = Math.min((t - ultimo) / 1000, 0.05);\n  ultimo = t;\n  if (!dentro) return;\n  const w = teclas.has('w') || teclas.has('arrowup');\n  const s = teclas.has('s') || teclas.has('arrowdown');\n  const a = teclas.has('a') || teclas.has('arrowleft');\n  const d = teclas.has('d') || teclas.has('arrowright');\n  if (!(w || s || a || d)) return;\n  adelante.subVectors(controls.target, camara.position).setY(0).normalize();\n  lado.set(adelante.z, 0, -adelante.x);\n  paso.set(0, 0, 0);\n  if (w) paso.add(adelante);\n  if (s) paso.sub(adelante);\n  if (d) paso.add(lado);\n  if (a) paso.sub(lado);\n  if (paso.lengthSq() === 0) return;\n  paso.normalize().multiplyScalar(1.6 * dt);\n  const nx = THREE.MathUtils.clamp(camara.position.x + paso.x, -LIMITE.x, LIMITE.x);\n  const nz = THREE.MathUtils.clamp(camara.position.z + paso.z, -LIMITE.z, LIMITE.z);\n  paso.set(nx - camara.position.x, 0, nz - camara.position.z);\n  camara.position.add(paso);\n  camara.position.y = nivel + ALTO_OJO;\n  controls.target.add(paso);\n  controls.update();\n})(performance.now());\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

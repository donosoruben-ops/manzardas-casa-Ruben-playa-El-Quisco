document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"es\"><head>\n<meta charset=\"utf-8\">\n<title>Mansarda 3D — techo 4 aguas<\u002Ftitle>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.184.0/build/three.module.js\",\n    \"three/addons/controls/OrbitControls.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\",\n    \"three/addons/exporters/OBJExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\",\n    \"three/addons/exporters/GLTFExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\"\n  },\n  \"integrity\": {\n    \"https://unpkg.com/three@0.184.0/build/three.module.js\": \"sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J\",\n    \"https://unpkg.com/three@0.184.0/build/three.core.js\": \"sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\": \"sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\": \"sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\": \"sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ\"\n  }\n}\n<\u002Fscript>\n<style>\n  html, body { margin: 0; height: 100%; background: #F2EFE8; }\n  three-d-stage:not(:defined) { visibility: hidden; }\n  three-d-stage { display: block; width: 100vw; height: 100vh; }\n  #ficha, #panel {\n    position: fixed; z-index: 5;\n    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.6;\n    color: #3A362F; background: rgba(252,251,248,0.9); border: 1px solid #C9C3B6;\n    padding: 10px 12px; letter-spacing: 0.02em;\n  }\n  #ficha { left: 24px; top: 24px; max-width: 296px; }\n  #ficha.plegada #fichaCuerpo { display: none; }\n  #fichaTitulo { cursor: pointer; }\n  #fichaTitulo::after { content: ' ▾'; color: #8C877C; }\n  #ficha.plegada #fichaTitulo::after { content: ' ▸'; }\n  #panel { left: 24px; top: 118px; bottom: 40px; display: flex; flex-direction: column; gap: 4px; width: 250px; overflow-y: auto; overflow-x: hidden; }\n  #ficha strong, .titulo { display: block; font-size: 11px; letter-spacing: 0.16em; color: #8C877C; }\n  #ficha strong { font-size: 13px; color: #3A362F; margin-bottom: 6px; }\n  .fila { display: flex; align-items: center; gap: 8px; }\n  input[type=range] { flex: 1; accent-color: #B4573A; }\n  #valorTecho { width: 66px; text-align: right; }\n  #panel button { padding: 5px 7px; font-size: 10.5px; line-height: 1.2; transition: background 0.15s, color 0.15s, border-color 0.15s; }\n  #panel button.activo { background: #2F7D4F; border-color: #2F7D4F; color: #FCFBF8; }\n  #monitoTip { font-size: 10px; color: #8C877C; line-height: 1.45; }\n  .grupo { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding-top: 4px; border-top: 1px solid rgba(0,0,0,0.10); }\n  .grupo .titulo, .grupo .fila { grid-column: 1 / -1; }\n  #panel { width: 268px; }\n  #ojosBtn { grid-column: 1 / -1; }\n  button {\n    font-family: inherit; font-size: 12px; letter-spacing: 0.04em; cursor: pointer;\n    padding: 8px 10px; border: 1px solid #3A362F; background: #FCFBF8; color: #1B1A17;\n  }\n  button:hover { background: #1B1A17; color: #FCFBF8; }\n  #ayuda { position: fixed; left: 24px; top: 76px; width: 268px; color: #5B564D; font-size: 10px; line-height: 1.4;\n    font-family: 'IBM Plex Mono', ui-monospace, monospace; z-index: 5; }\n<\u002Fstyle>\n<\u002Fhead>\n<body><three-d-stage name=\"mansarda\" background=\"#F2EFE8\"><\u002Fthree-d-stage>\n<div id=\"ficha\" class=\"plegada\">\n  <strong id=\"fichaTitulo\">AMPLIACIÓN MANSARDA<\u002Fstrong>\n  <div id=\"fichaCuerpo\">\n  Frente hacia la playa · 5,00 m<br>\n  Fondo · 6,00 m<br>\n  Altura de muro · 2,50 m<br>\n  Techo 4 aguas, cumbre en punto central<br>\n  Ventanal completo · 4,80 × 1,95 m, sin pilar intermedio<br>\n  Viga dintel del ventanal · 250 × 100, luz libre 5,00 m<br>\n  Inserta en el techo verde a dos aguas · 7,00 m de luz, 3,50 cada agua\n  <\u002Fdiv>\n<\u002Fdiv>\n<div id=\"panel\">\n  <div class=\"grupo\" style=\"border-top:none;padding-top:0\">\n    <span class=\"titulo\">TECHO MANSARDA<\u002Fspan>\n    <div class=\"fila\">\n      <input id=\"techo\" type=\"range\" min=\"0\" max=\"6\" step=\"0.1\" value=\"0\">\n      <span id=\"valorTecho\">0,00 m<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grupo\">\n    <span class=\"titulo\">BOTONES MANSARDA<\u002Fspan>\n    <button id=\"modo\">Recorrer<\u002Fbutton>\n    <button id=\"mansardaBtn\">Mostrar mansarda<\u002Fbutton>\n    <button id=\"maestranzaBtn\">Estructura fierro<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"grupo\">\n    <span class=\"titulo\">CASA EXISTENTE<\u002Fspan>\n    <button id=\"casaBtn\" style=\"grid-column:1 / -1\">MOSTRAR CASA ORIGINAL<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"grupo\">\n    <span class=\"titulo\">BOTONES TORRE<\u002Fspan>\n    <span class=\"titulo\" style=\"letter-spacing:0.1em\">TECHO TORRE<\u002Fspan>\n    <div class=\"fila\">\n      <input id=\"techoTorre\" type=\"range\" min=\"0\" max=\"6\" step=\"0.1\" value=\"0\">\n      <span id=\"valorTechoTorre\">0,00 m<\u002Fspan>\n    <\u002Fdiv>\n    <span class=\"titulo\" style=\"letter-spacing:0.1em\">TERCER PISO<\u002Fspan>\n    <div class=\"fila\">\n      <input id=\"piso3\" type=\"range\" min=\"0\" max=\"6\" step=\"0.1\" value=\"0\">\n      <span id=\"valorPiso3\">0,00 m<\u002Fspan>\n    <\u002Fdiv>\n    <button id=\"torreModo\">Recorrer torre<\u002Fbutton>\n    <button id=\"torreBtn\">Mostrar torre<\u002Fbutton>\n    <button id=\"torreMaestranzaBtn\">Estructura fierro<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"grupo\">\n    <span class=\"titulo\">MONITO DE ESCALA<\u002Fspan>\n    <button id=\"monitoBtn\">En la mansarda<\u002Fbutton>\n    <button id=\"monitoTorreBtn\">En la torre<\u002Fbutton>\n    <button id=\"ojosBtn\">Ver desde sus ojos<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div id=\"ayuda\">Arrastra para girar · rueda para zoom · click en el piso mueve el monito.<\u002Fdiv>\n<script src=\"9fa0f687-eced-412e-ab82-63056122d113\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\n\nconst M = {\n  muro: new THREE.MeshStandardMaterial({ name: 'muro', color: 0xE8E2D6, roughness: 0.92, metalness: 0, side: THREE.DoubleSide }),\n  tabique: new THREE.MeshStandardMaterial({ name: 'tabique', color: 0xDCD5C6, roughness: 0.95, metalness: 0, side: THREE.DoubleSide }),\n  teja: new THREE.MeshStandardMaterial({ name: 'teja', color: 0xB4573A, roughness: 0.8, metalness: 0, side: THREE.DoubleSide }),\n  madera: new THREE.MeshStandardMaterial({ name: 'madera', color: 0x8A6A46, roughness: 0.65, metalness: 0 }),\n  piso: new THREE.MeshStandardMaterial({ name: 'piso', color: 0xC5B294, roughness: 0.85, metalness: 0 }),\n  cristal: new THREE.MeshStandardMaterial({ name: 'cristal', color: 0xBFD8DE, roughness: 0.08, metalness: 0.25, transparent: true, opacity: 0.28, side: THREE.DoubleSide }),\n  ceramica: new THREE.MeshStandardMaterial({ name: 'ceramica', color: 0xF4F2ED, roughness: 0.25, metalness: 0 }),\n  textil: new THREE.MeshStandardMaterial({ name: 'textil', color: 0xE3DACA, roughness: 0.95, metalness: 0 })\n};\n\nconst model = new THREE.Group();\nmodel.name = 'mansarda';\nconst grupoTecho = new THREE.Group();\ngrupoTecho.name = 'techo';\nmodel.add(grupoTecho);\n\n// plan (x: 0..5 ancho, y: 0..6 fondo, y=0 al fondo, y=6 hacia la playa) -> escena (x, z)\nconst px = x => x - 2.5;\nconst pz = y => y - 3;\n\nfunction box(w, h, d, cx, cy, cz, mat, name, parent) {\n  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);\n  m.position.set(cx, cy, cz);\n  m.name = name;\n  m.castShadow = true;\n  m.receiveShadow = true;\n  (parent || model).add(m);\n  return m;\n}\nfunction muroX(x1, x2, yFijo, y0, y1, t, mat, name) {\n  box(x2 - x1, y1 - y0, t, px((x1 + x2) / 2), (y0 + y1) / 2, pz(yFijo), mat, name);\n}\nfunction muroY(y1, y2, xFijo, h0, h1, t, mat, name) {\n  box(t, h1 - h0, y2 - y1, px(xFijo), (h0 + h1) / 2, pz((y1 + y2) / 2), mat, name);\n}\n\nbox(5.0, 0.16, 6.0, 0, -0.08, 0, M.piso, 'losa_piso');\n\n// muro de fondo: puerta principal y dos ventanas\nmuroX(0.00, 0.10, 0, 0, 2.5, 0.15, M.muro, 'muro_fondo_a');\nmuroX(0.90, 1.40, 0, 0, 2.5, 0.15, M.muro, 'muro_fondo_b');\nmuroX(2.60, 4.05, 0, 0, 2.5, 0.15, M.muro, 'muro_fondo_c');\nmuroX(4.65, 5.00, 0, 0, 2.5, 0.15, M.muro, 'muro_fondo_d');\nmuroX(0.10, 0.90, 0, 2.10, 2.5, 0.15, M.muro, 'dintel_puerta_principal');\nmuroX(1.40, 2.60, 0, 0, 1.00, 0.15, M.muro, 'antepecho_ventana_camarote');\nmuroX(1.40, 2.60, 0, 2.10, 2.5, 0.15, M.muro, 'dintel_ventana_camarote');\nmuroX(4.05, 4.65, 0, 0, 1.00, 0.15, M.muro, 'antepecho_ventana_bano');\nmuroX(4.05, 4.65, 0, 2.10, 2.5, 0.15, M.muro, 'dintel_ventana_bano');\nbox(1.20, 1.10, 0.03, px(2.00), 1.55, pz(0), M.cristal, 'cristal_ventana_camarote');\nbox(0.60, 1.10, 0.03, px(4.35), 1.55, pz(0), M.cristal, 'cristal_ventana_bano');\n\nmuroY(0, 6, 0.00, 0, 2.5, 0.15, M.muro, 'muro_izquierdo');\nmuroY(0, 6, 5.00, 0, 2.5, 0.15, M.muro, 'muro_derecho');\n\n// fachada hacia la playa: ventanal 4,80 x 1,95, antepecho de 0,45 para pasar sobre el techo verde continuo\nmuroY(5.90, 6.00, 0.05, 0, 2.5, 0.10, M.muro, 'retorno_ventanal_izq');\nmuroY(5.90, 6.00, 4.95, 0, 2.5, 0.10, M.muro, 'retorno_ventanal_der');\nmuroX(0.05, 4.95, 5.95, 0, 0.45, 0.10, M.muro, 'antepecho_ventanal');\nbox(2.398, 1.95, 0.03, px(1.30), 1.425, pz(6.00), M.cristal, 'cristal_ventanal_izq');\nbox(2.398, 1.95, 0.03, px(3.70), 1.425, pz(6.00), M.cristal, 'cristal_ventanal_der');\nbox(4.90, 0.16, 0.14, px(2.50), 2.42, pz(6.00), M.madera, 'viga_ventanal');\nbox(4.90, 0.10, 0.16, px(2.50), 0.50, pz(6.00), M.madera, 'umbral_ventanal');\n\n// tabiques interiores, con sus vanos de puertas\n[[0.00, 0.75], [1.45, 2.50], [3.30, 4.00]].forEach((r, i) =>\n  muroY(r[0], r[1], 0.90, 0, 2.5, 0.10, M.tabique, 'tabique_pasillo_' + (i + 1)));\n[[0.00, 0.75], [1.45, 1.50]].forEach((r, i) =>\n  muroY(r[0], r[1], 3.00, 0, 2.5, 0.10, M.tabique, 'tabique_camarote_bano_' + (i + 1)));\n[[0.90, 3.50], [4.30, 5.00]].forEach((r, i) =>\n  muroX(r[0], r[1], 1.50, 0, 2.5, 0.10, M.tabique, 'tabique_servicios_' + (i + 1)));\n[[1.50, 3.10], [3.90, 4.00]].forEach((r, i) =>\n  muroY(r[0], r[1], 3.50, 0, 2.5, 0.10, M.tabique, 'tabique_dormitorio_' + (i + 1)));\n[[1.50, 1.90], [3.80, 4.00]].forEach((r, i) =>\n  muroY(r[0], r[1], 4.30, 0, 2.5, 0.10, M.tabique, 'tabique_closet_' + (i + 1)));\n[[0.00, 0.05], [0.85, 0.90], [0.90, 3.50], [4.30, 5.00]].forEach((r, i) =>\n  muroX(r[0], r[1], 4.00, 0, 2.5, 0.10, M.tabique, 'tabique_biblioteca_' + (i + 1)));\n\n// ——— mobiliario ———\n// cama grande 1,60 x 2,00\nbox(1.60, 0.30, 2.00, px(2.55), 0.15, pz(2.525), M.madera, 'cama_base');\nbox(1.56, 0.24, 1.96, px(2.55), 0.42, pz(2.525), M.textil, 'cama_colchon');\nbox(0.68, 0.13, 0.34, px(2.17), 0.60, pz(1.80), M.textil, 'cama_almohada_izq');\nbox(0.68, 0.13, 0.34, px(2.93), 0.60, pz(1.80), M.textil, 'cama_almohada_der');\nbox(1.66, 0.85, 0.06, px(2.55), 0.425, pz(1.56), M.madera, 'cama_respaldo');\n\n// camarote: literas 0,90 x 1,90\n[[1.04, 0.09], [2.86, 0.09], [1.04, 0.91], [2.86, 0.91]].forEach((p, i) =>\n  box(0.08, 1.95, 0.08, px(p[0]), 0.975, pz(p[1]), M.madera, 'litera_poste_' + (i + 1)));\nbox(1.90, 0.10, 0.90, px(1.95), 0.40, pz(0.50), M.madera, 'litera_baja_base');\nbox(1.86, 0.16, 0.86, px(1.95), 0.53, pz(0.50), M.textil, 'litera_baja_colchon');\nbox(1.90, 0.10, 0.90, px(1.95), 1.40, pz(0.50), M.madera, 'litera_alta_base');\nbox(1.86, 0.16, 0.86, px(1.95), 1.53, pz(0.50), M.textil, 'litera_alta_colchon');\nbox(1.90, 0.08, 0.08, px(1.95), 1.78, pz(0.91), M.madera, 'litera_baranda');\n[0.72, 1.06].forEach((h, i) => box(0.05, 0.05, 0.86, px(2.90), h, pz(0.50), M.madera, 'litera_peldano_' + (i + 1)));\n\n// baño: ducha 0,90 x 0,90, WC y lavamanos\nbox(0.90, 0.10, 0.90, px(4.50), 0.05, pz(0.50), M.ceramica, 'ducha_plato');\nbox(0.02, 1.90, 0.90, px(4.05), 1.05, pz(0.50), M.cristal, 'ducha_mampara_lateral');\nbox(0.90, 1.90, 0.02, px(4.50), 1.05, pz(0.95), M.cristal, 'ducha_mampara_frontal');\nbox(0.12, 0.10, 0.22, px(4.50), 2.05, pz(0.14), M.ceramica, 'ducha_rociador');\nbox(0.36, 0.42, 0.48, px(3.30), 0.21, pz(0.50), M.ceramica, 'wc_taza');\nbox(0.36, 0.06, 0.46, px(3.30), 0.45, pz(0.50), M.ceramica, 'wc_tapa');\nbox(0.38, 0.42, 0.18, px(3.30), 0.55, pz(0.17), M.ceramica, 'wc_tanque');\nbox(0.56, 0.80, 0.34, px(4.65), 0.40, pz(1.31), M.madera, 'lavamanos_mueble');\nbox(0.62, 0.06, 0.40, px(4.65), 0.83, pz(1.29), M.ceramica, 'lavamanos_cubierta');\nbox(0.60, 0.70, 0.02, px(4.65), 1.45, pz(1.46), M.cristal, 'lavamanos_espejo');\n\n// closet: repisas y barra\n[0.45, 0.95, 1.45, 2.20].forEach((h, i) =>\n  box(0.66, 0.04, 2.25, px(4.65), h, pz(2.725), M.madera, 'closet_repisa_' + (i + 1)));\nconst barra = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 2.25, 12), M.madera);\nbarra.name = 'closet_barra';\nbarra.rotation.x = Math.PI / 2;\nbarra.position.set(px(4.65), 1.95, pz(2.725));\nbarra.castShadow = true;\nmodel.add(barra);\n\n// ——— puertas ———\nconst H_PUERTA = 2.05;\n// correderas: hoja estacionada al lado del vano + riel superior\nfunction correderaY(xHoja, y1, y2, nombre) {  // desliza a lo largo de un tabique vertical\n  box(0.04, H_PUERTA, y2 - y1, px(xHoja), H_PUERTA / 2, pz((y1 + y2) / 2), M.madera, nombre);\n  box(0.07, 0.07, (y2 - y1) + 0.10, px(xHoja), H_PUERTA + 0.07, pz((y1 + y2) / 2), M.madera, nombre + '_riel');\n}\ncorrederaY(0.96, 0.02, 0.78, 'corredera_pasillo_camarote');\ncorrederaY(2.94, 0.02, 0.78, 'corredera_camarote_bano');\ncorrederaY(3.44, 2.28, 3.04, 'corredera_dormitorio');\nbox(0.04, H_PUERTA, 0.94, px(4.36), H_PUERTA / 2, pz(2.40), M.madera, 'corredera_closet_1');\nbox(0.04, H_PUERTA, 0.94, px(4.40), H_PUERTA / 2, pz(3.32), M.madera, 'corredera_closet_2');\n\n// batientes: hoja abierta 90°\nbox(0.04, H_PUERTA, 0.80, px(0.88), H_PUERTA / 2, pz(0.50), M.madera, 'puerta_principal_hoja');\nbox(0.04, H_PUERTA, 0.80, px(4.26), H_PUERTA / 2, pz(1.94), M.madera, 'puerta_bano_hoja');\nbox(0.04, H_PUERTA, 0.80, px(0.81), H_PUERTA / 2, pz(4.44), M.madera, 'puerta_biblioteca_izq_hoja');\nbox(0.04, H_PUERTA, 0.80, px(4.26), H_PUERTA / 2, pz(4.44), M.madera, 'puerta_biblioteca_der_hoja');\n\n// techo de 4 aguas: pirámide de base rectangular, cumbre en un punto central\nconst ALERO = 0.40, BASE_X = 5.0 + 2 * ALERO, BASE_Z = 6.0 + 2 * ALERO, ALTO_TECHO = 1.70;\nconst geoTecho = new THREE.CylinderGeometry(0.0001, 1, ALTO_TECHO, 4, 1, false);\ngeoTecho.rotateY(Math.PI / 4);\ngeoTecho.scale(BASE_X / Math.SQRT2, 1, BASE_Z / Math.SQRT2);\nconst techo = new THREE.Mesh(geoTecho, M.teja);\ntecho.name = 'techo_4_aguas';\ntecho.position.set(0, 2.5 + ALTO_TECHO / 2, 0);\ntecho.castShadow = true;\ntecho.receiveShadow = true;\ngrupoTecho.add(techo);\nbox(BASE_X, 0.14, 0.06, 0, 2.47, BASE_Z / 2, M.madera, 'tapacan_playa', grupoTecho);\nbox(BASE_X, 0.14, 0.06, 0, 2.47, -BASE_Z / 2, M.madera, 'tapacan_fondo', grupoTecho);\nbox(0.06, 0.14, BASE_Z, BASE_X / 2, 2.47, 0, M.madera, 'tapacan_der', grupoTecho);\nbox(0.06, 0.14, BASE_Z, -BASE_X / 2, 2.47, 0, M.madera, 'tapacan_izq', grupoTecho);\n\n// ——— estructura de maestranza: cubo de fierro + estructura del techo de 4 aguas ———\nconst MM = {\n  fierro: new THREE.MeshStandardMaterial({ name: 'fierro', color: 0x4A4E52, roughness: 0.5, metalness: 0.85 }),\n  galvanizado: new THREE.MeshStandardMaterial({ name: 'acero_galvanizado', color: 0xB9C0C4, roughness: 0.32, metalness: 0.95 })\n};\nconst maestranza = new THREE.Group();\nmaestranza.name = 'maestranza';\nmaestranza.visible = false;\nmodel.add(maestranza);\n\nfunction perfil(w, h, d, cx, cy, cz, mat, name) {\n  const m = new THREE.Mesh(new THREE.BoxGeometry(w A.alero, BAZ = MA.fondo + 2 * MA.alero;\nconst geoMA = new THREE.CylinderGeometry(0.0001, 1, MA.rise, 4, 1, false);\ngeoMA.rotateY(Math.PI / 4);\ngeoMA.scale(BAX / Math.SQRT2, 1, BAZ / Math.SQRT2);\nconst techoMA = new THREE.Mesh(geoMA, MC.verde);\ntechoMA.name = 'torre_techo_4_aguas';\ntechoMA.position.set(MA.x, MA.piso + 0.22 + MA.muro + MA.rise / 2, MA.z);\ntechoMA.castShadow = true;\ntorreG.add(techoMA);\n\n// ——— estructura de maestranza de la TORRE (dos niveles + techo 4 aguas, sin puerta trasera) ———\nconst torreMM = new THREE.Group();\ntorreMM.name = 'torre_maestranza';\ntorreMM.visible = false;\ntorreG.add(torreMM);\nfunction perfilT(w, hh, d, cx, cy, cz, mat, name) {\n  const m = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), mat);\n  m.position.set(cx, cy, cz);\n  m.name = name;\n  m.castShadow = true;\n  torreMM.add(m);\n}\nfunction barraT(p1, p2, esp, mat, name) {\n  const len = p1.distanceTo(p2);\n  const m = new THREE.Mesh(new THREE.BoxGeometry(esp, esp, len), mat);\n  m.position.copy(p1).add(p2).multiplyScalar(0.5);\n  m.lookAt(p2);\n  m.name = name;\n  m.castShadow = true;\n  torreMM.add(m);\n}\n{\n  const PT = 0.10, x0 = MA.x - MA.ancho / 2, x1 = MA.x + MA.ancho / 2;\n  const z0 = MA.z - MA.fondo / 2, z1 = MA.z + MA.fondo / 2;\n  const yBase = MA.base, yMed = MA.piso, yTop = MA.piso + 0.22 + MA.muro;\n  // pilares continuos de los dos niveles\n  [[x0, z0], [x1, z0], [x0, z1], [x1, z1], [x0, MA.z], [x1, MA.z]].forEach((p, i) =>\n    perfilT(PT, yTop - yBase, PT, p[0], (yBase + yTop) / 2, p[1], MM.fierro, 'torre_pilar_' + (i + 1)));\n  // vigas perimetrales en los tres niveles\n  [yBase, yMed, yTop].forEach((y, n) => {\n    perfilT(MA.ancho + PT, PT, PT, MA.x, y, z0, MM.fierro, 'torre_viga_fondo_' + (n + 1));\n    perfilT(MA.ancho + PT, n === 2 ? 0.25 : PT, PT, MA.x, n === 2 ? y - 0.075 : y, z1, MM.fierro, 'torre_viga_frente_' + (n + 1));\n    perfilT(PT, PT, MA.fondo, x0, y, MA.z, MM.fierro, 'torre_viga_poniente_' + (n + 1));\n    perfilT(PT, PT, M tanera_poniente');\n  perfilT(0.06, 0.06, BAZ * (1 - kT), MA.x + ax * (1 - kT), yT, MA.z, MM.fierro, 'torre_costanera_oriente');\n}\n\n\ncasa.visible = false;\n// ——— escalera de caracol: 1er piso → 2do piso → 3er piso ———\n{\n  const cx = MA.x - MA.ancho / 2 + 0.88, cz = MA.z - MA.fondo / 2 + 0.88;\n  const yTop = MA.piso + 0.22;                 // nivel del 3er piso\n  const alzada = 0.18, radio = 0.68;\n  const pasos = Math.round(yTop / alzada);\n  const dGiro = (Math.PI * 2) / 15;            // 15 peldaños por vuelta\n  const eje = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, yTop + 0.10, 16), MM.galvanizado);\n  eje.name = 'escalera_eje';\n  eje.position.set(cx, (yTop + 0.10) / 2, cz);\n  eje.castShadow = true;\n  torreG.add(eje);\n  for (let i = 1; i <= pasos; i++) {\n    const ang = i * dGiro;\n    const peld = new THREE.Mesh(new THREE.BoxGeometry(radio - 0.06, 0.05, 0.30), M.madera);\n    peld.name = 'escalera_peldano_' + i;\n    peld.position.set(cx + Math.cos(ang) * (radio + 0.06) / 2, i * alzada, cz + Math.sin(ang) * (radio + 0.06) / 2);\n    peld.rotation.y = -ang;\n    peld.castShadow = true;\n    torreG.add(peld);\n    // pasamano: postes cada dos peldaños\n    if (i % 2 === 0) {\n      const poste = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.95, 8), MM.galvanizado);\n      poste.name = 'escalera_poste_' + i;\n      poste.position.set(cx + Math.cos(ang) * radio, i * alzada + 0.475, cz + Math.sin(ang) * radio);\n      poste.castShadow = true;\n      torreG.add(poste);\n    }\n    // pasamanos continuos: exterior a 0,95 y travesaño intermedio a 0,50, en toda la subida\n    if (i > 1) {\n      const a0 = (i - 1) * dGiro;\n      [[0.95, 0.030, 'pasamano'], [0.50, 0.020, 'travesano']].forEach(([alt, esp, tipo]) => {\n        const p0 = new THREE.Vector3(cx + Math.cos(a0) * radio, (i - 1) * alzada + alt, cz + Math.sin(a0) * radio);\n        const p1 = new THREE.Vector3(cx + Math.cos(ang) * radio, i * alzada + alt, cz + Math.sin(ang) + 1);\n      riel.position.set(b[3], yb + 0.95, b[4]);\n      riel.castShadow = true;\n      torreG.add(riel);\n      for (let k = 0; k < 2; k++) {\n        const pst = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.95, 8), MM.galvanizado);\n        pst.name = 'escalera_baranda_llegada_poste_' + (n + 1) + '_' + (k + 1);\n        pst.position.set(n === 0 ? b[3] - 0.40 + k * 0.80 : b[3], yb + 0.475, n === 0 ? b[4] : b[4] - 0.40 + k * 0.80);\n        pst.castShadow = true;\n        torreG.add(pst);\n      }\n    });\n  }\n  // descanso en el 2do piso y llegada al 3er piso\n  [MA.base, yTop].forEach((y, n) => {\n    const desc = new THREE.Mesh(new THREE.BoxGeometry(0.90, 0.06, 0.90), M.madera);\n    desc.name = 'escalera_descanso_' + (n + 1);\n    desc.position.set(cx + 0.20, y + 0.03, cz + 0.20);\n    desc.castShadow = true;\n    torreG.add(desc);\n  });\n}\n\n// grupos para levantar el techo y el tercer piso de la torre\nconst torreTechoG = new THREE.Group();\ntorreTechoG.name = 'torre_techo';\nconst torreP3 = new THREE.Group();\ntorreP3.name = 'torre_piso3';\nconst nombresP3 = ['torre_losa_p3', 'torre_losa_p3_b', 'torre_muro_fondo', 'torre_muro_poniente', 'torre_muro_oriente', 'torre_dintel', 'torre_ventanal'];\n[...torreG.children].forEach(c => {\n  if (c.name === 'torre_techo_4_aguas') torreTechoG.add(c);\n  else if (nombresP3.includes(c.name)) torreP3.add(c);\n});\ntorreP3.add(torreTechoG);\ntorreG.add(torreP3);\n\nstage._scene.add(casa);\n\n// ——— monito de escala (1,70 m), se mueve con W A S D o flechas ———\nconst monito = new THREE.Group();\nmonito.name = 'monito';\nmonito.visible = false;\nstage._scene.add(monito);\nconst MMon = {\n  piel: new THREE.MeshStandardMaterial({ name: 'monito_piel', color: 0xD9A57C, roughness: 0.8 }),\n  ropa: new THREE.MeshStandardMaterial({ name: 'monito_ropa', color: 0x2E5C7A, roughness: 0.85 }),\n  pantalon: new THREE.MeshStandardMaterial({ name: 'monito_pantalon', color: 0x3A3F45, roughness: 0.9 })\n};\nfunction pieza
